<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<script src="store-config.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>設定 · 學士店</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
:root{
  --b:#1A3A5C;--bl:#E8F0FA;--bm:#4A7CB5;
  --g:#1A6B3C;--gl:#E8F5EE;--gm:#3DA86A;
  --amber:#8A5500;--amberl:#FFF0D0;
  --red:#C0302A;--redl:#FDECEA;
  --ink:#0F1923;--ink2:#3A4A5C;--ink3:#7A8A9C;--ink4:#C8D4DF;
  --bg:#EFF2F7;--white:#fff;--bd:#D4DCE8;
  --r:14px;--r2:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',sans-serif;font-size:14px}
button,input,select{font-family:inherit;font-size:14px}
button{cursor:pointer}

/* 頂欄 */
.top{background:var(--b);color:#fff;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:20}
.top-title{font-weight:900;font-size:16px}
.top-sub{font-size:11px;opacity:.75;margin-top:1px}
.who{font-size:11px;background:rgba(255,255,255,.18);padding:4px 10px;border-radius:20px;white-space:nowrap}

/* 分頁列 */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--white);border-bottom:1px solid var(--bd);position:sticky;top:56px;z-index:19;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:8px 14px;border-radius:20px;border:1px solid var(--bd);background:var(--white);color:var(--ink2);font-weight:700;font-size:13px}
.tab[aria-selected="true"]{background:var(--b);border-color:var(--b);color:#fff}

.wrap{padding:14px;max-width:860px;margin:0 auto}
.panel{display:none}
.panel.on{display:block}

.card{background:var(--white);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card-h{font-weight:900;font-size:15px;margin:0 0 4px}
.card-note{font-size:12px;color:var(--ink3);line-height:1.6;margin:0 0 12px}

/* 表單 */
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}
.f{flex:1 1 130px;min-width:0}
.f label{display:block;font-size:11px;font-weight:700;color:var(--ink3);margin-bottom:4px}
.f input,.f select{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:var(--r2);background:var(--white);color:var(--ink)}
.f input:focus,.f select:focus{outline:2px solid var(--bm);outline-offset:1px;border-color:var(--bm)}

.btn{padding:9px 16px;border:none;border-radius:var(--r2);background:var(--b);color:#fff;font-weight:700;white-space:nowrap}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn.ghost{background:var(--white);color:var(--ink2);border:1px solid var(--bd)}
.btn.danger{background:var(--red)}
.btn.sm{padding:6px 11px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* 清單 */
.list{border:1px solid var(--bd);border-radius:var(--r2);overflow:hidden}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--bd);background:var(--white)}
.item:last-child{border-bottom:none}
.item-main{flex:1;min-width:0}
.item-name{font-weight:700}
.item-meta{font-size:11px;color:var(--ink3);margin-top:2px;line-height:1.5}
.off{opacity:.5}
.pill{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--bl);color:var(--b);margin-left:6px}
.pill.flav{background:var(--amberl);color:var(--amber)}
.pill.stop{background:var(--redl);color:var(--red)}
.empty{padding:22px 12px;text-align:center;color:var(--ink3);font-size:13px;line-height:1.7}

.sub-h{font-weight:700;font-size:13px;color:var(--ink2);margin:16px 0 8px}
.sub-h:first-child{margin-top:0}

/* 提示 */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink);color:#fff;padding:11px 18px;border-radius:22px;font-size:13px;font-weight:700;z-index:60;opacity:0;pointer-events:none;transition:opacity .18s;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.toast.bad{background:var(--red)}

.gate{padding:56px 22px;text-align:center;color:var(--ink2);line-height:1.9}
.gate h2{color:var(--b)}
</style>
</head>
<body>

<div class="top">
  <div>
    <div class="top-title">設定</div>
    <div class="top-sub">瀧飲山潮 · 學士店</div>
  </div>
  <span class="who" id="who"></span>
</div>

<div id="gate" class="gate" style="display:none"></div>

<div id="app" style="display:none">
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="wrap" id="panels"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════════════════
   設定頁 — 集中管理各店的人員、產品、貨物等主檔
   改一個地方，系統各功能頁下次載入就會讀到新資料
   ══════════════════════════════════════════════════ */
var API_URL = StoreConfig.getApiUrl();
var ME = null;

/* ── API ───────────────────────────────────────── */
function apiGet(params, cb){
  var qs = Object.keys(params).map(function(k){
    return encodeURIComponent(k)+'='+encodeURIComponent(params[k]);
  }).join('&');
  fetch(API_URL+'?'+qs).then(function(r){return r.json();})
    .then(function(d){ cb&&cb(d); })
    .catch(function(e){ console.warn(e); cb&&cb(null); });
}
function apiPost(params, cb){
  var body = Object.keys(params).map(function(k){
    return encodeURIComponent(k)+'='+encodeURIComponent(String(params[k]));
  }).join('&');
  fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body})
    .then(function(r){return r.json();})
    .then(function(d){ cb&&cb(d); })
    .catch(function(e){ console.warn(e); cb&&cb(null); });
}

/* ── 小工具 ─────────────────────────────────────── */
var $ = function(id){ return document.getElementById(id); };
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
var toastTimer;
function toast(msg, bad){
  var t = $('toast');
  t.textContent = msg;
  t.className = 'toast on' + (bad ? ' bad' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.className = 'toast'; }, 2600);
}
function done(d, okMsg, reload){
  if(!d){ toast('連線失敗，請檢查網路後再試一次', true); return false; }
  if(!d.ok){ toast(d.error || '儲存失敗', true); return false; }
  toast(d.message || okMsg);
  if(reload) reload();
  return true;
}
function val(id){ return ($(id).value || '').trim(); }
function clear(){ for(var i=0;i<arguments.length;i++) $(arguments[i]).value=''; }

/* ── 分頁定義 ───────────────────────────────────── */
/* minRole：可使用該分頁的最低角色代碼（數字越小權限越高）
   帳號分頁沿用首頁既有政策，只開放給 1 級，不因設定頁而放寬 */
var TABS = [
  {id:'emp',   name:'人員',    minRole:3, render:renderEmp},
  {id:'prod',  name:'產品',    minRole:3, render:renderProd},
  {id:'inv',   name:'盤點品項', minRole:3, render:renderInv},
  {id:'stock', name:'進貨品項', minRole:3, render:renderStock},
  {id:'jelly', name:'仙草凍',  minRole:3, render:renderJelly},
  {id:'clean', name:'清潔',    minRole:3, render:renderClean},
  {id:'cost',  name:'成本',    minRole:2, render:renderCost},
  {id:'acc',   name:'帳號',    minRole:1, render:renderAcc},
  {id:'line',  name:'LINE 通知', minRole:3, render:renderLine}
];
var MY_TABS = [];

function buildTabs(){
  $('tabs').innerHTML = MY_TABS.map(function(t,i){
    return '<button class="tab" role="tab" id="tab-'+t.id+'" aria-selected="'+(i===0)+'" '+
           'onclick="go(\''+t.id+'\')">'+esc(t.name)+'</button>';
  }).join('');
  $('panels').innerHTML = MY_TABS.map(function(t,i){
    return '<section class="panel'+(i===0?' on':'')+'" id="panel-'+t.id+'"></section>';
  }).join('');
}
var loaded = {};
function go(id){
  MY_TABS.forEach(function(t){
    $('tab-'+t.id).setAttribute('aria-selected', t.id===id);
    $('panel-'+t.id).classList.toggle('on', t.id===id);
  });
  if(!loaded[id]){
    loaded[id]=true;
    MY_TABS.filter(function(t){return t.id===id;})[0].render();
  }
}
function panel(id, html){ $('panel-'+id).innerHTML = html; }
function busy(id, label){
  panel(id, '<div class="card"><div class="empty">載入'+esc(label)+'…</div></div>');
}

/* ══════════════════════════════════════════════════
   人員
   ══════════════════════════════════════════════════ */
function renderEmp(){
  busy('emp','人員名單');
  apiGet({action:'getEmps'}, function(d){
    var list = (d && d.ok && d.data) ? d.data : [];
    panel('emp',
      '<div class="card">'+
        '<h2 class="card-h">人員名單</h2>'+
        '<p class="card-note">這份名單是全系統共用的。在這裡新增一位夥伴，溫度記錄、盤點、進貨、開收班、仙草凍等頁面的人員選單都會同步出現。</p>'+
        '<div class="row">'+
          '<div class="f"><label>姓名</label><input id="emp-name" placeholder="輸入姓名" autocomplete="off"></div>'+
          '<button class="btn" onclick="empAdd()">新增夥伴</button>'+
        '</div>'+
        (list.length
          ? '<div class="list">'+list.map(function(n){
              return '<div class="item"><div class="item-main"><div class="item-name">'+esc(n)+'</div></div>'+
                     '<button class="btn danger sm" onclick="empDel(\''+esc(n)+'\')">移除</button></div>';
            }).join('')+'</div>'
          : '<div class="empty">還沒有任何夥伴。<br>新增第一位，各功能頁的人員選單就會出現他。</div>')+
      '</div>');
  });
}
function empAdd(){
  var n = val('emp-name');
  if(!n){ toast('請先輸入姓名', true); return; }
  apiGet({action:'addEmp', name:n}, function(d){
    if(done(d,'已新增')) { clear('emp-name'); loaded.emp=false; go('emp'); }
  });
}
function empDel(n){
  if(!confirm('確定要把「'+n+'」從人員名單移除嗎？\n\n移除後，所有頁面的人員選單都不會再出現他。\n已經記錄過的歷史資料不受影響。')) return;
  apiGet({action:'deleteEmp', name:n}, function(d){
    if(done(d,'已移除')) { loaded.emp=false; go('emp'); }
  });
}

/* ══════════════════════════════════════════════════
   產品（收班記錄的飲品品項）
   ══════════════════════════════════════════════════ */
function renderProd(){
  busy('prod','產品品項');
  apiGet({action:'prodItemGetAll'}, function(d){
    var list = (d && d.ok && d.data) ? d.data : [];
    panel('prod',
      '<div class="card">'+
        '<h2 class="card-h">飲品品項</h2>'+
        '<p class="card-note">收班表單的「買／取」欄位會依這份清單產生，佔比與加總也依此計算。'+
        '新增品項時，收班記錄會自動補上對應欄位。<br>'+
        '停用的品項只是不再出現在表單上，欄位與歷史資料都會保留。</p>'+
        '<div class="row">'+
          '<div class="f"><label>名稱</label><input id="pd-name" placeholder="例如：烏龍" autocomplete="off"></div>'+
          '<div class="f"><label>代碼（英文）</label><input id="pd-code" placeholder="例如：Oolong" autocomplete="off"></div>'+
          '<div class="f" style="flex:0 0 92px"><label>分類</label>'+
            '<select id="pd-cat"><option value="風味">風味</option><option value="原味">原味</option></select></div>'+
          '<button class="btn" onclick="prodAdd()">新增品項</button>'+
        '</div>'+
        (list.length
          ? '<div class="list">'+list.map(function(it){
              return '<div class="item'+(it.enabled?'':' off')+'">'+
                '<div class="item-main">'+
                  '<div class="item-name">'+esc(it.name)+
                    '<span class="pill'+(it.cat==='風味'?' flav':'')+'">'+esc(it.cat)+'</span>'+
                    (it.enabled?'':'<span class="pill stop">已停用</span>')+
                  '</div>'+
                  '<div class="item-meta">代碼 '+esc(it.code)+'　收班欄位：'+esc(it.name)+'買 / '+esc(it.name)+'取</div>'+
                '</div>'+
                (it.enabled
                  ? '<button class="btn danger sm" onclick="prodStop(\''+esc(it.id)+'\',\''+esc(it.name)+'\')">停用</button>'
                  : '<button class="btn ghost sm" onclick="prodOn('+JSON.stringify(it).replace(/"/g,'&quot;')+')">重新啟用</button>')+
              '</div>';
            }).join('')+'</div>'
          : '<div class="empty">尚未建立品項。</div>')+
      '</div>');
  });
}
function prodAdd(){
  var name = val('pd-name'), code = val('pd-code');
  if(!name){ toast('請輸入品項名稱', true); return; }
  if(!code){ toast('請輸入英文代碼', true); return; }
  apiPost({action:'prodItemSave', name:name, code:code, cat:$('pd-cat').value}, function(d){
    if(done(d,'已新增品項')) { clear('pd-name','pd-code'); loaded.prod=false; go('prod'); }
  });
}
function prodStop(id, name){
  if(!confirm('確定要停用「'+name+'」嗎？\n\n收班表單將不再顯示這個品項，\n但 Sheets 欄位與過去的記錄都會完整保留。')) return;
  apiPost({action:'prodItemDelete', id:id}, function(d){
    if(done(d,'已停用')) { loaded.prod=false; go('prod'); }
  });
}
function prodOn(it){
  apiPost({action:'prodItemSave', id:it.id, code:it.code, name:it.name,
           cat:it.cat, order:it.order, enabled:'true', jelly:it.jelly||''}, function(d){
    if(done(d,'已重新啟用')) { loaded.prod=false; go('prod'); }
  });
}

/* ══════════════════════════════════════════════════
   盤點品項
   ══════════════════════════════════════════════════ */
function renderInv(){
  busy('inv','盤點品項');
  apiGet({action:'invItemGetAll'}, function(d){
    var list = (d && d.ok && d.data) ? d.data : [];
    panel('inv',
      '<div class="card">'+
        '<h2 class="card-h">盤點品項</h2>'+
        '<p class="card-note">日盤、週盤、月盤的清單依此產生。'+
        '「小單位」是最小計數單位，中、大單位填了換算倍數才會在盤點時提供換算。</p>'+
        '<div class="row">'+
          '<div class="f"><label>名稱</label><input id="iv-name" placeholder="例如：封口膜" autocomplete="off"></div>'+
          '<div class="f" style="flex:0 0 96px"><label>分類</label><input id="iv-cat" placeholder="耗材" autocomplete="off"></div>'+
          '<div class="f" style="flex:0 0 96px"><label>盤點週期</label>'+
            '<select id="iv-modes">'+
              '<option value="DW">日盤＋週盤</option><option value="D">只有日盤</option>'+
              '<option value="W">只有週盤</option><option value="M">只有月盤</option>'+
              '<option value="DWM">日週月都盤</option>'+
            '</select></div>'+
        '</div>'+
        '<div class="row">'+
          '<div class="f" style="flex:0 0 90px"><label>小單位</label><input id="iv-sn" placeholder="個"></div>'+
          '<div class="f" style="flex:0 0 90px"><label>中單位</label><input id="iv-mn" placeholder="條"></div>'+
          '<div class="f" style="flex:0 0 110px"><label>一中＝幾小</label><input id="iv-ms" type="number" inputmode="decimal" placeholder="50"></div>'+
          '<div class="f" style="flex:0 0 90px"><label>大單位</label><input id="iv-ln" placeholder="箱"></div>'+
          '<div class="f" style="flex:0 0 110px"><label>一大＝幾中</label><input id="iv-lm" type="number" inputmode="decimal" placeholder="20"></div>'+
          '<button class="btn" onclick="invAdd()">新增品項</button>'+
        '</div>'+
        (list.length
          ? '<div class="list">'+list.map(function(it){
              var u = [it.sn];
              if(it.mn) u.push(it.mn+'（'+it.ms+it.sn+'）');
              if(it.ln) u.push(it.ln+'（'+it.lm+it.mn+'）');
              return '<div class="item"><div class="item-main">'+
                '<div class="item-name">'+esc(it.name)+'<span class="pill">'+esc(it.cat||'未分類')+'</span></div>'+
                '<div class="item-meta">'+esc(u.join(' · '))+'　週期 '+esc(it.modes)+'</div></div>'+
                '<button class="btn danger sm" onclick="invDel(\''+esc(it.id)+'\',\''+esc(it.name)+'\')">刪除</button></div>';
            }).join('')+'</div>'
          : '<div class="empty">尚未建立盤點品項。</div>')+
      '</div>');
  });
}
function invAdd(){
  var name = val('iv-name');
  if(!name){ toast('請輸入品項名稱', true); return; }
  if(!val('iv-sn')){ toast('請填寫小單位，盤點時需要它計數', true); return; }
  apiPost({action:'invItemSave', name:name, cat:val('iv-cat'), modes:$('iv-modes').value,
    sn:val('iv-sn'), mn:val('iv-mn'), ms:val('iv-ms')||0,
    ln:val('iv-ln'), lm:val('iv-lm')||0, wu:'', sw:0, extra:'{}'}, function(d){
    if(done(d,'已新增')) { clear('iv-name','iv-cat','iv-sn','iv-mn','iv-ms','iv-ln','iv-lm'); loaded.inv=false; go('inv'); }
  });
}
function invDel(id, name){
  if(!confirm('確定要刪除盤點品項「'+name+'」嗎？\n\n之後的盤點清單不會再出現它，\n已經盤過的歷史記錄不受影響。')) return;
  apiPost({action:'invItemDelete', id:id}, function(d){
    if(done(d,'已刪除')) { loaded.inv=false; go('inv'); }
  });
}

/* ══════════════════════════════════════════════════
   進貨品項 + 來源
   ══════════════════════════════════════════════════ */
function renderStock(){
  busy('stock','進貨設定');
  apiGet({action:'stockItemGetAll'}, function(a){
    apiGet({action:'stockSourceGetAll'}, function(b){
      var items = (a && a.ok && a.data) ? a.data : [];
      var srcs  = (b && b.ok && b.data) ? b.data : [];
      panel('stock',
        '<div class="card">'+
          '<h2 class="card-h">進貨品項</h2>'+
          '<p class="card-note">進貨登記時可選的品項。單位由小到大填寫，換算倍數用來換算成最小單位總量。</p>'+
          '<div class="row">'+
            '<div class="f"><label>品項名稱</label><input id="sk-name" placeholder="例如：鮮奶" autocomplete="off"></div>'+
            '<div class="f" style="flex:0 0 110px"><label>分類</label>'+
              '<select id="sk-cat">'+
                '<option value="dry">常溫</option><option value="cold">冷藏</option>'+
                '<option value="pkg">包材</option><option value="sup">耗材</option>'+
                '<option value="hw">五金</option>'+
              '</select></div>'+
          '</div>'+
          '<div class="row">'+
            '<div class="f" style="flex:0 0 90px"><label>最小單位</label><input id="sk-u1" placeholder="瓶"></div>'+
            '<div class="f" style="flex:0 0 90px"><label>中單位</label><input id="sk-u2" placeholder="箱"></div>'+
            '<div class="f" style="flex:0 0 110px"><label>一中＝幾小</label><input id="sk-q2" type="number" inputmode="decimal" placeholder="12"></div>'+
            '<button class="btn" onclick="stockAdd()">新增品項</button>'+
          '</div>'+
          (items.length
            ? '<div class="list">'+items.map(function(it){
                var u = (it.units||[]).map(function(x){ return x.n+'×'+x.q; }).join(' · ');
                return '<div class="item"><div class="item-main">'+
                  '<div class="item-name">'+esc(it.name)+'</div>'+
                  '<div class="item-meta">'+esc(u||'未設定單位')+'</div></div>'+
                  '<button class="btn danger sm" onclick="stockDel(\''+esc(it.id)+'\',\''+esc(it.name)+'\')">刪除</button></div>';
              }).join('')+'</div>'
            : '<div class="empty">尚未建立進貨品項。</div>')+
        '</div>'+
        '<div class="card">'+
          '<h2 class="card-h">進貨來源</h2>'+
          '<p class="card-note">登記進貨時可選的來源，例如廠商、倉庫或人員採買。</p>'+
          '<div class="row">'+

  });

(function init(){
  document.querySelector('.top-sub').textContent =
    StoreConfig.getBrandName() + ' · ' + StoreConfig.getStoreName();
  document.title = '設定 · ' + StoreConfig.getStoreName();

  var raw = null;
  try { raw = sessionStorage.getItem('tw_user'); } catch(e){}
  if(!raw){
    $('gate').style.display = 'block';
    $('gate').innerHTML = '<h2>請先登入</h2><p>設定頁需要登入後才能使用。<br>請回到系統首頁登入，再從側邊選單進入設定。</p>';
    return;
  }
  try { ME = JSON.parse(raw); } catch(e){ ME = null; }
  if(!ME){
    $('gate').style.display = 'block';
    $('gate').innerHTML = '<h2>登入資料已失效</h2><p>請回到首頁重新登入。</p>';
    return;
  }

  var role = parseInt(ME.role, 10) || 9;
  $('who').textContent = (ME.name || ME.username) + '　' + (ME.roleName || '');

  if(role > 3){
    $('gate').style.display = 'block';
    $('gate').innerHTML = '<h2>你沒有設定權限</h2>'+
      '<p>設定頁只開放給店長以上的角色使用。<br>'+
      '目前登入的是「'+esc(ME.roleName || ('角色 '+role))+'」。<br><br>'+
      '需要調整設定，請聯絡店長或管理者。</p>';
    return;
  }

  $('app').style.display = 'block';
  MY_TABS = TABS.filter(function(t){ return role <= t.minRole; });
  buildTabs();
  go(MY_TABS[0].id);
})();
</script>
</body>
</html>
